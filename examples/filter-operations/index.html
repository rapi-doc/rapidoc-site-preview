/reports/**" title="/reports and every path under it, at any depth">/reports/**</button><button type="button" class="rd-pill filter-chip" data-filter="/reports/*" title="Only one segment below /reports: /reports/{reportId}">/reports/*</button><button type="button" class="rd-pill filter-chip" data-filter="badge:Core" title="Operations with the badge label Core">badge:Core</button><button type="button" class="rd-pill filter-chip" data-filter="tag:Public !deprecated" title="Public operations, without the deprecated one">tag:Public !deprecated</button><button type="button" class="rd-pill filter-chip" data-filter="!badge:Internal !badge:admin-use-only" title="Leaves out operations with the badge Internal or admin-use-only">!badge:Internal !badge:admin-use-only</button><button type="button" class="rd-pill filter-chip" data-filter title="No filter: every operation">(all)</button></div></div></rapi-doc><script>
    function applyFilter(value) {
      const input = document.getElementById('filter-operations');
      if (typeof value === 'string') input.value = value;
      const filter = input.value.trim();
      document.getElementById('thedoc').setAttribute('filter-operations', filter);
      document.querySelectorAll('.filter-chip').forEach((chip) => {
        const active = chip.dataset.filter === filter;
        chip.classList.toggle('active', active);
        chip.setAttribute('aria-pressed', String(active));
      });
    }
    document.querySelectorAll('.filter-chip').forEach((chip) => {
      chip.addEventListener('click', () => applyFilter(chip.dataset.filter));
    });
    applyFilter();
  </script></body></html>
